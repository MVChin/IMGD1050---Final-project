<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Solid Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f1e;
    color: #e8e8f0;
    min-height: 100vh;
    padding: 24px;
  }
  .container {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 4px;
  }
  h1 {
    margin: 0;
    font-weight: 600;
    letter-spacing: -0.5px;
    font-size: 1.6em;
  }
  .subtitle {
    color: #8080a0;
    font-size: 0.95em;
  }
  .panel {
    background: #1c1c33;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #2e2e52;
  }
  .controls label {
    display: block;
    margin-top: 14px;
    font-size: 0.88em;
    color: #a8a8c4;
    font-weight: 500;
  }
  .controls label:first-child { margin-top: 0; }
  .controls select, .controls input {
    width: 100%;
    padding: 9px 11px;
    margin-top: 5px;
    background: #0f0f1e;
    border: 1px solid #3a3a5c;
    color: #e8e8f0;
    border-radius: 6px;
    font-size: 0.95em;
    font-family: inherit;
  }
  .controls select:focus, .controls input:focus {
    outline: none;
    border-color: #64c8ff;
    box-shadow: 0 0 0 3px rgba(100, 200, 255, 0.15);
  }
  .canvas-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 440px;
    background: #070714;
    border-radius: 12px;
    border: 1px solid #2e2e52;
    overflow: hidden;
    position: relative;
  }
  .canvas-wrap .hint {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-size: 0.75em;
    color: #606080;
  }
  .results {
    grid-column: 1 / -1;
    background: #1c1c33;
    padding: 22px;
    border-radius: 12px;
    border: 1px solid #2e2e52;
  }
  .results h2 {
    margin: 0 0 12px 0;
    font-size: 1em;
    color: #a8a8c4;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .formula {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    background: #0f0f1e;
    padding: 11px 14px;
    border-radius: 6px;
    margin: 6px 0;
    border-left: 3px solid #64c8ff;
    font-size: 0.92em;
    line-height: 1.5;
  }
  .formula b { color: #fff; }
  .formula .label { color: #64c8ff; display: inline-block; min-width: 110px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>3D Solid Generator</h1>
    <span class="subtitle">Cylinders, cones, prisms & pyramids</span>
  </header>

  <div class="panel controls">
    <label>Solid type
      <select id="solidType">
        <option value="cylinder">Cylinder</option>
        <option value="cone">Cone</option>
        <option value="prism">Prism</option>
        <option value="pyramid">Pyramid</option>
      </select>
    </label>

    <div id="radiusField">
      <label>Radius (r)
        <input type="number" id="radius" value="5" min="0.1" step="0.5">
      </label>
    </div>

    <div id="sidesField" class="hidden">
      <label>Number of base sides (n)
        <input type="number" id="sides" value="6" min="3" max="24" step="1">
      </label>
    </div>

    <div id="sideLengthField" class="hidden">
      <label>Side length (s)
        <input type="number" id="sideLength" value="4" min="0.1" step="0.5">
      </label>
    </div>

    <label>Height (h)
      <input type="number" id="height" value="10" min="0.1" step="0.5">
    </label>
  </div>

  <div class="canvas-wrap" id="canvas-container">
    <span class="hint">click + drag to rotate</span>
  </div>

  <div class="results" id="results">
    <h2>Results</h2>
    <div id="formulaDisplay"></div>
  </div>
</div>

<script>
const params = {
  type: 'cylinder',
  radius: 5,
  height: 10,
  sides: 6,
  sideLength: 4
};

function setup() {
  const canvas = createCanvas(780, 440, WEBGL);
  canvas.parent('canvas-container');
  applyParams();
}

function computeAutoScale() {
  let maxDim;
  if (params.type === 'cylinder' || params.type === 'cone') {
    maxDim = Math.max(params.radius * 2, params.height);
  } else {
    const R = params.sideLength / (2 * Math.sin(Math.PI / params.sides));
    maxDim = Math.max(R * 2, params.height);
  }
  return 230 / Math.max(maxDim, 0.1);
}

function draw() {
  background(125, 125, 20);
  orbitControl(2, 2, 0.1);

  ambientLight(60);
  directionalLight(220, 230, 255, -0.4, 0.6, -0.8);
  directionalLight(80, 140, 200, 0.8, -0.3, 0.5);
//Draw grid for reference  
  push();
  stroke(40);
  strokeWeight(1);
  const gridSize = 500, step = 50;
  for (let i = -gridSize; i <= gridSize; i += step) {
    line(i, 250, -gridSize, i, 250, gridSize);
    line(-gridSize, 250, i, gridSize, 250, i);
  }
  pop();

//draw solid
  push();
  fill(100, 200, 255, 220);
  stroke(255, 255, 255, 140);
  strokeWeight(1);

  const s = computeAutoScale();//scale the requested parameters to keep the rendered solid within the canvas. 

  if (params.type === 'cylinder') {
    cylinder(params.radius * s, params.height * s, 48);
  } else if (params.type === 'cone') {
    cone(params.radius * s, params.height * s, 48);
  } else if (params.type === 'prism') {
    drawPrism(params.sides, params.sideLength * s, params.height * s);
  } else if (params.type === 'pyramid') {
    drawPyramid(params.sides, params.sideLength * s, params.height * s);
  }
  pop();
}

function drawPrism(n, s, h) {
  const R = s / (2 * Math.sin(Math.PI / n));//radius of circumscribed circle of the top and bottom faces

  // top face using the centre of the solid as a point of reference 
  beginShape();
  for (let i = 0; i < n; i++) {
    const a = TWO_PI * i / n;//increase the angle 
    vertex(R * cos(a), -h/2, R * sin(a));
  }
  endShape(CLOSE);

  // bottom face.  repeat for the bottom face but flip the y axis co-ordinate
  beginShape();
  for (let i = 0; i < n; i++) {
    const a = TWO_PI * i / n;
    vertex(R * cos(a), h/2, R * sin(a));
  }
  endShape(CLOSE);

  // sides
  for (let i = 0; i < n; i++) {
    const a1 = TWO_PI * i / n; //left side 
    const a2 = TWO_PI * (i+1) / n;//right side
    beginShape();//draw each face as a rectangle 
    vertex(R * cos(a1), -h/2, R * sin(a1));//top left coordinate
    vertex(R * cos(a2), -h/2, R * sin(a2));//top right coordinate
    vertex(R * cos(a2),  h/2, R * sin(a2));//bottom left coordinate
    vertex(R * cos(a1),  h/2, R * sin(a1));//bottom right coordinate
    endShape(CLOSE);
  }
}

function drawPyramid(n, s, h) {
  const R = s / (2 * Math.sin(Math.PI / n));//radius of the base's circumscribed circle

  // base
  beginShape();
  for (let i = 0; i < n; i++) {
    const a = TWO_PI * i / n;
    vertex(R * cos(a), h/2, R * sin(a));
  }
  endShape(CLOSE);

  // triangular side faces to apex
  for (let i = 0; i < n; i++) {
    const a1 = TWO_PI * i / n;
    const a2 = TWO_PI * (i+1) / n;
    beginShape();
    vertex(R * cos(a1), h/2, R * sin(a1));
    vertex(R * cos(a2), h/2, R * sin(a2));
    vertex(0, -h/2, 0);//peak vertex
    endShape(CLOSE);
  }
}

// --- UI wiring ---
const solidTypeEl = document.getElementById('solidType');
const radiusField = document.getElementById('radiusField');
const sidesField = document.getElementById('sidesField');
const sideLengthField = document.getElementById('sideLengthField');

function syncVisibleFields() {
  const t = solidTypeEl.value;
  const showRadius = (t === 'cylinder' || t === 'cone');
  const showPoly = (t === 'prism' || t === 'pyramid');
  radiusField.classList.toggle('hidden', !showRadius);
  sidesField.classList.toggle('hidden', !showPoly);
  sideLengthField.classList.toggle('hidden', !showPoly);
}

['solidType', 'radius', 'sides', 'sideLength', 'height'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', applyParams);
  el.addEventListener('change', () => { syncVisibleFields(); applyParams(); });
});

function applyParams() {
  params.type = solidTypeEl.value;
  params.radius = Math.max(0.1, parseFloat(document.getElementById('radius').value) || 1);
  params.height = Math.max(0.1, parseFloat(document.getElementById('height').value) || 1);
  params.sides = Math.max(3, Math.min(24, parseInt(document.getElementById('sides').value, 10) || 3));
  params.sideLength = Math.max(0.1, parseFloat(document.getElementById('sideLength').value) || 1);
  updateResults();
}

// --- math / results ---
function fmt(x, d=3) {
  if (Number.isInteger(x)) return x.toString();
  const r = Math.round(x * Math.pow(10, d)) / Math.pow(10, d);
  return r.toString();
}

function updateResults() {
  const out = document.getElementById('formulaDisplay');
  const r = params.radius, h = params.height;
  const n = params.sides, s = params.sideLength;
  let html = '';

  if (params.type === 'cylinder') {
    const vCoef = r * r * h;
    const saCoef = 2*r*r + 2*r*h;
    html = `
      <div class="formula"><span class="label">Volume:</span> V = πr²h = π(${fmt(r)})²(${fmt(h)}) = <b>${fmt(vCoef)}π</b></div>
      <div class="formula"><span class="label">Surface Area:</span> SA = 2πr² + 2πrh = 2π(${fmt(r*r)}) + 2π(${fmt(r*h)}) = <b>${fmt(saCoef)}π</b></div>
    `;
  } else if (params.type === 'cone') {
    const vCoef = (r * r * h) / 3;
    const l2 = r*r + h*h;
    const l = Math.sqrt(l2);
    const lIsInt = Number.isInteger(l);
    const saR2 = r*r;
    const saRL = r * l;
    const saTotal = saR2 + saRL;
    const slantStr = lIsInt
      ? `√${fmt(l2)} = ${fmt(l)}`
      : `√${fmt(l2)} ≈ ${fmt(l)}`;
    const saExact = lIsInt
      ? `<b>${fmt(saTotal)}π</b>`
      : `<b>(${fmt(saR2)} + ${fmt(r)}√${fmt(l2)})π ≈ ${fmt(saTotal)}π</b>`;
    html = `
      <div class="formula"><span class="label">Volume:</span> V = ⅓πr²h = ⅓π(${fmt(r)})²(${fmt(h)}) = <b>${fmt(vCoef)}π</b></div>
      <div class="formula"><span class="label">Slant height:</span> ℓ = √(r² + h²) = ${slantStr}</div>
      <div class="formula"><span class="label">Surface Area:</span> SA = πr² + πrℓ = ${saExact}</div>
    `;
  } else if (params.type === 'prism') {
    const baseArea = (n * s * s) / (4 * Math.sin(Math.PI / n)/Math.cos(Math.PI/n));
    const perim = n * s;
    const V = baseArea * h;
    const lateralSA = perim * h;
    const SA = 2 * baseArea + lateralSA;
    html = `
      <div class="formula"><span class="label">Base area:</span> A = (n·s²) / (4·sin(360/(2 x n))/cos(360/(2 x n))) = (${n}·${fmt(s*s)}) / (4·sin(180/${n})/cos(180/${n})) ≈ <b>${fmt(baseArea)}</b></div>
      <div class="formula"><span class="label">Perimeter:</span> P = n·s = ${n}·${fmt(s)} = <b>${fmt(perim)}</b></div>
      <div class="formula"><span class="label">Volume:</span> V = A·h ≈ ${fmt(baseArea)} · ${fmt(h)} ≈ <b>${fmt(V)}</b></div>
      <div class="formula"><span class="label">Surface Area:</span> SA = 2A + P·h ≈ 2(${fmt(baseArea)}) + (${fmt(perim)})(${fmt(h)}) ≈ <b>${fmt(SA)}</b></div>
    `;
  } else if (params.type === 'pyramid') {
    const baseArea = (n * s * s) / (4 * Math.sin(Math.PI / n)/Math.cos(Math.PI/n));
    const apothem = s / (2 * Math.sin(Math.PI / n)/ Math.cos(Math.PI/n));
    const slant = Math.sqrt(apothem * apothem + h * h);
    const perim = n * s;
    const V = baseArea * h / 3;
    const lateralSA = 0.5 * perim * slant;
    const SA = baseArea + lateralSA;
    html = `
      <div class="formula"><span class="label">Base area:</span> A = (n·s²) / (4 * Math.sin(Math.PI / n)/Math.cos(Math.PI/n)) ≈ <b>${fmt(baseArea)}</b></div>
      <div class="formula"><span class="label">Apothem:</span> a = s / (2·sin(π/n)/cos(π/n)) ≈ <b>${fmt(apothem)}</b></div>
      <div class="formula"><span class="label">Slant height:</span> ℓ = √(a² + h²) ≈ <b>${fmt(slant)}</b></div>
      <div class="formula"><span class="label">Volume:</span> V = ⅓·A·h ≈ ⅓(${fmt(baseArea)})(${fmt(h)}) ≈ <b>${fmt(V)}</b></div>
      <div class="formula"><span class="label">Surface Area:</span> SA = A + ½·P·ℓ ≈ ${fmt(baseArea)} + ½(${fmt(perim)})(${fmt(slant)}) ≈ <b>${fmt(SA)}</b></div>
    `;
  }

  out.innerHTML = html;
}

syncVisibleFields();
</script>
</body>
</html>
